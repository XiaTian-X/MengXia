[workspace]
members = [
    "bins/mengxia",
    "bins/mengxiad",
    "crates/mengxia-app",
    "crates/mengxia-core-proto",
    "crates/mengxia-domain",
    "crates/mengxia-events",
    "crates/mengxia-framing",
    "crates/mengxia-platform-fs",
    "crates/mengxia-platform-sandbox",
    "crates/mengxia-plugin-host",
    "crates/mengxia-plugin-package",
    "crates/mengxia-plugin-proto",
    "crates/mengxia-plugin-security",
    "crates/mengxia-ports",
    "crates/mengxia-storage-local",
    "crates/mengxia-store-sqlite",
    "crates/mengxia-testkit",
    "crates/mengxia-types",
]
exclude = [
    "crates/mengxia-testkit/tests/fixtures/architecture/forbidden-edge",
    "crates/mengxia-testkit/tests/fixtures/types/marker-mismatch",
    "third_party/libsqlite3-sys-0.38.2",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
mengxia-app = { path = "crates/mengxia-app", version = "=0.1.0" }
mengxia-core-proto = { path = "crates/mengxia-core-proto", version = "=0.1.0" }
mengxia-domain = { path = "crates/mengxia-domain", version = "=0.1.0" }
mengxia-events = { path = "crates/mengxia-events", version = "=0.1.0" }
mengxia-ports = { path = "crates/mengxia-ports", version = "=0.1.0" }
mengxia-platform-fs = { path = "crates/mengxia-platform-fs", version = "=0.1.0" }
mengxia-framing = { path = "crates/mengxia-framing", version = "=0.1.0" }
mengxia-store-sqlite = { path = "crates/mengxia-store-sqlite", version = "=0.1.0" }
mengxia-storage-local = { path = "crates/mengxia-storage-local", version = "=0.1.0" }
mengxia-types = { path = "crates/mengxia-types", version = "=0.1.0" }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
prost-build = { version = "=0.14.4", default-features = false }
prost-types = { version = "=0.14.4", default-features = false, features = ["std"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "=1.24.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[patch.crates-io]
libsqlite3-sys = { path = "third_party/libsqlite3-sys-0.38.2" }
