[package]
name = "libsqlite3-sys"
version = "0.38.2"
edition = "2021"
rust-version = "1.63"
authors = ["The rusqlite developers"]
build = "build.rs"
links = "sqlite3"
description = "Native bindings to the libsqlite3 library"
license = "MIT"
repository = "https://github.com/rusqlite/rusqlite"

[features]
bundled = ["bundled_bindings"]
bundled_bindings = []
buildtime_bindgen = []
bundled-sqlcipher = []
bundled-sqlcipher-vendored-openssl = []
bundled-windows = []
column_metadata = []
in_gecko = []
loadable_extension = []
min_sqlite_version_3_34_1 = []
preupdate_hook = []
session = []
sqlcipher = []
unlock_notify = []
wasm32-wasi-vfs = []
with-asan = []

[lib]
name = "libsqlite3_sys"
path = "src/lib.rs"
