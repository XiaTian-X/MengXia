version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
      rust-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
