version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # Disable routine Cargo version PRs; security updates remain enabled.
    open-pull-requests-limit: 0
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
