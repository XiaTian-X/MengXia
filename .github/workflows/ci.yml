name: Layered TASK-001 through TASK-010 repository gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify documentation or code change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths fail closed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            pull_request) scope=$(scripts/classify-ci-change.sh "$PR_BASE" "$PR_HEAD") ;;
            push) scope=$(scripts/classify-ci-change.sh "$PUSH_BASE" "$PUSH_HEAD") ;;
            workflow_dispatch|schedule) scope=code ;;
            *) exit 1 ;;
          esac
          case "$scope" in docs|code) ;; *) exit 1 ;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  repository-gates:
    name: Rust 1.98 arm64 macOS formal components
    needs: classify
    if: >-
      needs.classify.outputs.scope == 'code' &&
      (github.event_name == 'pull_request' || github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    env:
      MENGXIA_ACL_BUILD_CLASS: attested
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record tested checkout
        id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select and attest macOS ACL toolchain
        run: |
          set -eu
          /bin/sh scripts/verify-macos-acl-toolchain.sh --select-attested
          /bin/sh scripts/verify-macos-acl-toolchain.sh

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked

      - name: Run formal native components
        # Includes scripts/verify-task-004.sh --native-component under attestation.
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/verify-repository.sh formal-native

  task-003-second-uid:
    name: TASK-003 real second-UID authorization
    needs: classify
    if: >-
      needs.classify.outputs.scope == 'code' &&
      (github.event_name == 'pull_request' || github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    env:
      MENGXIA_ACL_BUILD_CLASS: attested
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record tested checkout
        id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select and attest macOS ACL toolchain
        run: |
          set -eu
          /bin/sh scripts/verify-macos-acl-toolchain.sh --select-attested
          /bin/sh scripts/verify-macos-acl-toolchain.sh

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked

      - name: Run only the formal second-UID component
        run: scripts/verify-task-003-formal-second-uid.sh component

  pull-request-validation:
    name: Pull request or documentation validation
    needs: classify
    if: >-
      needs.classify.outputs.scope == 'docs' || github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select macOS toolchain for code feedback
        if: needs.classify.outputs.scope == 'code'
        run: /bin/sh scripts/verify-macos-acl-toolchain.sh --select-attested

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked

      - name: Run documentation validation
        if: needs.classify.outputs.scope == 'docs'
        run: scripts/verify-repository.sh docs

      - name: Run fast developer feedback
        if: needs.classify.outputs.scope == 'code'
        run: scripts/verify-ci-fast.sh

  supply-chain:
    name: Shared supply-chain policy
    needs: classify
    if: needs.classify.outputs.scope == 'code'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tested checkout
        id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Install pinned supply-chain verifier
        run: scripts/dev-toolchain.sh prepare --network
      - name: Verify current shared supply policy
        run: scripts/verify-ci-supply.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true

  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - classify
      - repository-gates
      - task-003-second-uid
      - pull-request-validation
      - dependency-review
      - supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      EXPECTED_SHA: ${{ github.sha }}
      FORMAL_SHA: ${{ needs.repository-gates.outputs.sha }}
      SECOND_UID_SHA: ${{ needs.task-003-second-uid.outputs.sha }}
      SUPPLY_SHA: ${{ needs.supply-chain.outputs.sha }}
      SUPPLY_RESULT: ${{ needs.supply-chain.result }}
      SCOPE: ${{ needs.classify.outputs.scope }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      FORMAL_RESULT: ${{ needs.repository-gates.result }}
      SECOND_UID_RESULT: ${{ needs.task-003-second-uid.result }}
      PR_VALIDATION_RESULT: ${{ needs.pull-request-validation.result }}
      DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the exact classified evidence set
        # Exercise the same fail-closed checker on the actual Linux runner first.
        run: |
          scripts/check-ci-merge-gate.sh --self-test
          scripts/check-ci-merge-gate.sh
      - name: Attribute completed native and supply evidence
        if: needs.classify.outputs.scope == 'code'
        run: |
          set -eu
          while IFS= read -r test_id; do
            echo "$test_id: PASS"
          done < scripts/ci-baseline-mappings.txt
          # MAINT-003 is additive; the retained 150-ID baseline is immutable.
          for test_id in TEST-MAINT3-ENV-001 TEST-MAINT3-INSTALL-001 TEST-MAINT3-CACHE-001 TEST-MAINT3-SECURITY-001 TEST-MAINT3-INTEGRATION-001; do
            echo "$test_id: PASS"
          done
