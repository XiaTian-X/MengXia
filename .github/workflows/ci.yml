name: TASK-001 through TASK-007 repository gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-gates:
    name: Rust 1.98 arm64 macOS
    runs-on: macos-26
    timeout-minutes: 180
    env:
      MENGXIA_ACL_BUILD_CLASS: attested
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select and attest macOS ACL toolchain
        run: |
          set -eu
          /usr/bin/sudo /usr/bin/xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          /bin/sh scripts/verify-macos-acl-toolchain.sh

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked

      - name: Install pinned supply-chain verifier
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run TASK-007 formal aggregate
        # Retains TASK-006 and every earlier transitive gate exactly once,
        # including scripts/verify-task-004.sh through the accepted gate graph.
        run: scripts/verify-task-007.sh formal

  task-003-second-uid:
    name: TASK-003 real second-UID authorization
    runs-on: macos-26
    timeout-minutes: 40
    env:
      MENGXIA_ACL_BUILD_CLASS: attested
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select and attest macOS ACL toolchain
        run: |
          set -eu
          /usr/bin/sudo /usr/bin/xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          /bin/sh scripts/verify-macos-acl-toolchain.sh

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked

      - name: Install pinned supply-chain verifier
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run TASK-003 formal second-UID gate
        run: scripts/verify-task-003-formal-second-uid.sh
