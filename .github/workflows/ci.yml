name: TASK-001 repository gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-gates:
    name: Rust 1.98 arm64 macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned supply-chain verifier
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run TASK-001 gates
        run: scripts/verify-task-001.sh
