[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 0.93
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "deny"
external-default-features = "deny"

[[bans.features]]
crate = "deranged@0.5.8"
allow = ["default"]
exact = true

[[bans.features]]
crate = "regex-syntax@0.8.11"
allow = [
    "default",
    "std",
    "unicode",
    "unicode-age",
    "unicode-bool",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
    "unicode-script",
    "unicode-segment",
]
exact = true

# Exact transitive defaults required by the accepted TASK-004 packages. The direct
# rusqlite/sha2/rustix declarations still disable their own defaults; these upstream
# manifests do not expose a parent-side switch for the listed dependency edge.
[[bans.features]]
crate = "digest@0.11.3"
allow = ["default", "block-api"]
exact = true

[[bans.features]]
crate = "fallible-iterator@0.3.0"
allow = ["default", "alloc"]
exact = true

[[bans.features]]
crate = "windows-sys@0.61.2"
allow = [
    "default",
    "Win32",
    "Win32_Foundation",
    "Win32_Networking",
    "Win32_Networking_WinSock",
    "Win32_System",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
]
exact = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
unused-allowed-source = "allow"
