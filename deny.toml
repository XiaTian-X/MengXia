[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]
exceptions = [
    { allow = ["MIT-0"], crate = "borrow-or-share@0.2.4" },
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "deny"
external-default-features = "deny"
skip = [
    { name = "foldhash", version = "=0.1.5", reason = "jsonschema 0.56.0 retains hashbrown 0.15 while its current transitive graph also selects hashbrown 0.17/foldhash 0.2" },
    { name = "getrandom", version = "=0.3.4", reason = "jsonschema 0.56.0 transitive ahash retains getrandom 0.3 alongside the workspace-pinned getrandom 0.4" },
    { name = "hashbrown", version = "=0.15.5", reason = "prost-build 0.14.4 pulls petgraph's pre-indexmap hashbrown alongside indexmap's current hashbrown" },
    { name = "r-efi", version = "=5.3.0", reason = "getrandom 0.3 retains r-efi 5 alongside getrandom 0.4's r-efi 6" },
    { name = "syn", version = "=2.0.119", reason = "prost-derive 0.14.4 and pinned tokio-macros 2.7.2 require different accepted syn majors" },
]

# Exact transitive defaults required by the accepted TASK-003 prost/Tokio packages.
# Direct workspace declarations retain default-features = false.
[[bans.features]]
crate = "anyhow@1.0.104"
allow = ["default", "std"]
exact = true

[[bans.features]]
crate = "bytes@1.12.1"
allow = ["default", "std"]
exact = true

[[bans.features]]
crate = "errno@0.3.14"
allow = ["default", "std"]
exact = true

[[bans.features]]
crate = "fastrand@2.5.0"
allow = ["alloc", "default", "std"]
exact = true

[[bans.features]]
crate = "itertools@0.14.0"
allow = ["default", "use_alloc", "use_std"]
exact = true

[[bans.features]]
crate = "libc@0.2.189"
allow = ["default", "std"]
exact = true

[[bans.features]]
crate = "proc-macro2@1.0.107"
allow = ["default", "proc-macro"]
exact = true

[[bans.features]]
crate = "quote@1.0.47"
allow = ["default", "proc-macro"]
exact = true

[[bans.features]]
crate = "rustix@1.1.4"
allow = ["alloc", "default", "fs", "process", "std"]
